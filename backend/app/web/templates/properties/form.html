<div
    id="propertyModal"
    class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4"
>

    <div class="bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-4 sm:p-6 lg:p-8 border border-gray-200 shadow-2xl">

        <div class="flex items-center justify-between mb-6">

            <h2
                id="modalTitle"
                class="text-2xl font-bold text-gray-800"
            >
                Nueva Propiedad
            </h2>

            <button
                onclick="closeModal()"
                class="text-gray-400 hover:text-gray-600 transition-colors text-2xl w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100"
            >
                ✕
            </button>

        </div>

        <form id="propertyForm" action="/properties/create" method="POST">
            <input
                type="hidden"
                name="property_id"
                id="property_id"
            >

            <!-- Información Básica -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    Información Básica
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Título <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            name="title"
                            placeholder="Ej: Casa en zona norte"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="title"
                            required
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Valor <span class="text-red-500">*</span>
                        </label>

                        <div class="flex gap-2">
                            <input
                                type="number"
                                name="price"
                                step="0.01"
                                min="0"
                                placeholder="Ej: 150000"
                                class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                                id="price"
                                required
                            >

                            <select
                                name="moneda"
                                id="moneda"
                                class="w-28 border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            >
                                <option value="EUR">EUR</option>
                                <option value="USD">USD</option>
                                <option value="GBP">GBP</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Tipo de inmueble
                        </label>
                        <input
                            type="text"
                            name="property_type"
                            placeholder="Ej: Piso, Chalet, Local"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="property_type"
                            list="propertyTypeOptions"
                        >
                        <datalist id="propertyTypeOptions">
                            <option value="Piso"></option>
                            <option value="Casa"></option>
                            <option value="Chalet"></option>
                            <option value="Ático"></option>
                            <option value="Dúplex"></option>
                            <option value="Local"></option>
                            <option value="Nave"></option>
                            <option value="Oficina"></option>
                            <option value="Garaje"></option>
                            <option value="Terreno"></option>
                        </datalist>
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Operación
                        </label>
                        <select
                            name="business_type"
                            id="business_type"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                        >
                            <option value="Venta">Venta</option>
                            <option value="Alquiler">Alquiler</option>
                            <option value="Alquiler con opción a compra">Alquiler con opción a compra</option>
                            <option value="Traspaso">Traspaso</option>
                        </select>
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Cliente <span class="text-red-500">*</span>
                        </label>
                        <select
                            name="client_id"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="client_id"
                            required
                        >
                            <option value="">Seleccionar cliente</option>
                            {% for client in clients %}
                            <option value="{{ client.id }}">{{ client.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Agente <span class="text-red-500">*</span>
                        </label>
                        <select
                            name="agent_id"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="agent_id"
                            required
                        >
                            <option value="">Seleccionar agente</option>
                            {% for agent in agents %}
                            <option value="{{ agent.id }}">{{ agent.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="mt-4">
                    <label class="block mb-2 text-sm font-medium text-gray-700">
                        Observaciones
                    </label>
                    <textarea
                        name="description"
                        placeholder="Descripción detallada de la propiedad..."
                        class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                        id="description"
                        rows="3"
                    ></textarea>
                </div>
            </div>

            <!-- Identificación -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5a1.99 1.99 0 011.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.99 1.99 0 013 12V7a4 4 0 014-4z"></path>
                    </svg>
                    Identificación
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Referencia
                        </label>
                        <input
                            type="text"
                            name="referencia"
                            placeholder="Ej: MOY-00123"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="referencia"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Código
                        </label>
                        <input
                            type="text"
                            name="codigo"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="codigo"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Ref. catastral
                        </label>
                        <input
                            type="text"
                            name="ref_catastral"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="ref_catastral"
                        >
                    </div>

                </div>
            </div>

            <!-- Ubicación -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    Ubicación
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Dirección <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            name="address"
                            placeholder="Ej: Calle Mayor 12, 3º B"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="address"
                            required
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Población <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            name="city"
                            placeholder="Ej: Madrid"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="city"
                            required
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Zona
                        </label>
                        <input
                            type="text"
                            name="zona"
                            placeholder="Ej: Centro"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="zona"
                        >
                    </div>

                    <div class="grid grid-cols-2 gap-4">

                        <div>
                            <label class="block mb-2 text-sm font-medium text-gray-700">
                                Cód. postal
                            </label>
                            <input
                                type="text"
                                name="cod_postal"
                                maxlength="5"
                                inputmode="numeric"
                                placeholder="28001"
                                class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                                id="cod_postal"
                            >
                        </div>

                        <div>
                            <label class="block mb-2 text-sm font-medium text-gray-700">
                                País
                            </label>
                            <input
                                type="text"
                                name="pais"
                                placeholder="España"
                                class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                                id="pais"
                            >
                        </div>

                    </div>

                </div>
            </div>

            <!-- Características -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                    </svg>
                    Características
                </h3>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            M2 útiles
                        </label>
                        <input
                            type="number"
                            name="m2_utiles"
                            step="0.01"
                            min="0"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="m2_utiles"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            M2 construidos
                        </label>
                        <input
                            type="number"
                            name="m2_construidos"
                            step="0.01"
                            min="0"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="m2_construidos"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Planta
                        </label>
                        <input
                            type="text"
                            name="planta"
                            placeholder="Ej: 3º"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="planta"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Dormitorios
                        </label>
                        <input
                            type="number"
                            name="num_dormitorios"
                            min="0"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="num_dormitorios"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Baños y aseos
                        </label>
                        <input
                            type="number"
                            name="num_banos_aseos"
                            min="0"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="num_banos_aseos"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Salones
                        </label>
                        <input
                            type="number"
                            name="num_salones"
                            min="0"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="num_salones"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Terrazas
                        </label>
                        <input
                            type="number"
                            name="num_terrazas"
                            min="0"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="num_terrazas"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Armarios
                        </label>
                        <input
                            type="number"
                            name="num_armarios"
                            min="0"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="num_armarios"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Garaje / Aparcam.
                        </label>
                        <input
                            type="number"
                            name="num_garaje_aparcam"
                            min="0"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="num_garaje_aparcam"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Ascensores
                        </label>
                        <input
                            type="number"
                            name="num_ascensores"
                            min="0"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="num_ascensores"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Despachos
                        </label>
                        <input
                            type="number"
                            name="num_despachos"
                            min="0"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="num_despachos"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Locales
                        </label>
                        <input
                            type="number"
                            name="num_locales"
                            min="0"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="num_locales"
                        >
                    </div>

                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Estado del inmueble
                        </label>
                        <input
                            type="text"
                            name="estado_inmueble"
                            placeholder="Ej: Nuevo, A reformar"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="estado_inmueble"
                            list="estadoInmuebleOptions"
                        >
                        <datalist id="estadoInmuebleOptions">
                            <option value="Nuevo"></option>
                            <option value="Buen estado"></option>
                            <option value="A reformar"></option>
                            <option value="Reformado"></option>
                            <option value="En construcción"></option>
                            <option value="No disponible"></option>
                        </datalist>
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Situación
                        </label>
                        <input
                            type="text"
                            name="situacion"
                            placeholder="Ej: Libre, Alquilado, Ocupado"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="situacion"
                            list="situacionOptions"
                        >
                        <datalist id="situacionOptions">
                            <option value="Libre"></option>
                            <option value="Alquilado"></option>
                            <option value="Ocupado"></option>
                        </datalist>
                    </div>

                </div>
            </div>

            <!-- Gestión -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l6.964-6.964A6 6 0 1121 9z"></path>
                    </svg>
                    Gestión
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Fecha de alta
                        </label>
                        <input
                            type="date"
                            name="fecha_alta"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="fecha_alta"
                        >
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-700">
                            Llaves
                        </label>
                        <input
                            type="text"
                            name="llaves"
                            placeholder="Ej: En oficina, juego nº 4"
                            class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                            id="llaves"
                        >
                    </div>

                </div>

                <div class="mt-4">
                    <label class="block mb-2 text-sm font-medium text-gray-700">
                        Mandato / Acuerdo
                    </label>
                    <textarea
                        name="mandato_acuerdo"
                        placeholder="Condiciones del mandato de venta o acuerdo con el propietario..."
                        class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                        id="mandato_acuerdo"
                        rows="2"
                    ></textarea>
                </div>
            </div>

            <!-- Estado (solo en modo edición) -->
            <div id="statusContainer" class="mb-6 hidden">
                <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Estado comercial
                </h3>

                <select
                    id="status"
                    name="status"
                    class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                >
                    <option value="Activa">Activa</option>
                    <option value="Reservada">Reservada</option>
                    <option value="Pausada">Pausada</option>
                    <option value="Vendida">Vendida</option>
                    <option value="Retirada">Retirada</option>
                    <option value="Archivada">Archivada</option>
                </select>
            </div>

            <!-- Configuración de Informes Automáticos -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Informes Automáticos
                </h3>

                <div class="space-y-4">
                    <!-- Checkbox principal -->
                    <label class="flex items-start gap-3 p-4 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors cursor-pointer">
                        <input
                            type="checkbox"
                            name="auto_send_report"
                            id="auto_send_report"
                            class="mt-1 w-5 h-5 text-blue-600 rounded focus:ring-2 focus:ring-blue-200"
                            onchange="toggleReportSchedule()"
                        >
                        <div class="flex-1">
                            <span class="font-medium text-gray-800">Enviar informes automáticamente</span>
                            <p class="text-sm text-gray-500 mt-1">Genera y envía informes periódicos al cliente de forma automática</p>
                        </div>
                    </label>

                    <!-- Configuración de horario -->
                    <div id="reportScheduleContainer" class="pl-8 space-y-4 hidden">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block mb-2 text-sm font-medium text-gray-700">
                                    Frecuencia
                                </label>
                                <select
                                    name="report_frequency"
                                    id="report_frequency"
                                    class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                                >
                                    <option value="">Seleccionar</option>
                                    <option value="MONTHLY">Mensual</option>
                                    <option value="WEEKLY">Semanal</option>
                                    <option value="BIWEEKLY">Quincenal</option>
                                </select>
                            </div>

                            <div>
                                <label class="block mb-2 text-sm font-medium text-gray-700">
                                    Día del mes
                                </label>
                                <input
                                    type="number"
                                    name="report_day"
                                    id="report_day"
                                    min="1"
                                    max="31"
                                    placeholder="Ej: 15"
                                    class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                                >
                                <p class="text-xs text-gray-500 mt-1">1-31</p>
                            </div>

                            <div>
                                <label class="block mb-2 text-sm font-medium text-gray-700">
                                    Hora de envío
                                </label>
                                <input
                                    type="number"
                                    name="report_hour"
                                    id="report_hour"
                                    min="0"
                                    max="23"
                                    placeholder="Ej: 9"
                                    class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
                                >
                                <p class="text-xs text-gray-500 mt-1">0-23 (24h)</p>
                            </div>
                        </div>

                        <div class="bg-blue-50 border border-blue-200 rounded-xl p-3">
                            <p class="text-sm text-blue-800">
                                <strong>Ejemplo:</strong> Si seleccionas "Mensual", día "15" y hora "9",
                                el sistema generará y enviará el informe el día 15 de cada mes a las 9:00 AM.
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6 pt-6 border-t border-gray-200">
                <button
                    type="button"
                    onclick="closeModal()"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-xl transition-colors font-medium"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="bg-black hover:bg-gray-800 text-white px-6 py-3 rounded-xl transition-colors font-medium flex items-center gap-2"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    Guardar
                </button>
            </div>

        </form>

    </div>

</div>

<script>

// Campos del formulario que se rellenan desde los data-* del botón Editar.
// El nombre del campo coincide con el id del input y con la clave camelCase
// del dataset (data-ref-catastral -> refCatastral).
const PROPERTY_FIELDS = [
    "title",
    "price",
    "moneda",
    "property_type",
    "business_type",
    "client_id",
    "agent_id",
    "description",
    "referencia",
    "codigo",
    "ref_catastral",
    "address",
    "city",
    "zona",
    "cod_postal",
    "pais",
    "m2_utiles",
    "m2_construidos",
    "planta",
    "num_dormitorios",
    "num_banos_aseos",
    "num_salones",
    "num_terrazas",
    "num_armarios",
    "num_garaje_aparcam",
    "num_ascensores",
    "num_despachos",
    "num_locales",
    "estado_inmueble",
    "situacion",
    "fecha_alta",
    "llaves",
    "mandato_acuerdo",
    "status"
];

// Valores que se aplican cuando el dato viene vacío
const PROPERTY_FALLBACKS = {
    moneda: "EUR",
    business_type: "Venta",
    status: "Activa"
};

function datasetKey(field) {
    return field.replace(/_([a-z0-9])/g, (match, char) => char.toUpperCase());
}

function toggleReportSchedule() {
    const checkbox = document.getElementById('auto_send_report');
    const container = document.getElementById('reportScheduleContainer');

    if (checkbox.checked) {
        container.classList.remove('hidden');
    } else {
        container.classList.add('hidden');
    }
}

function openModal() {
    const modal = document.getElementById("propertyModal");
    document.getElementById("modalTitle").innerText = "Nueva Propiedad";
    document.getElementById("statusContainer").classList.add("hidden");
    document.getElementById("propertyForm").reset();
    document.getElementById("propertyForm").action = "/properties/create";

    // Resetear campos de auto_send_report
    document.getElementById("auto_send_report").checked = false;
    document.getElementById("reportScheduleContainer").classList.add("hidden");

    modal.classList.remove("hidden");
    modal.classList.add("flex");
}

function editProperty(data) {
    openModal();

    document.getElementById("modalTitle").innerText = "Actualizar Propiedad";
    document.getElementById("statusContainer").classList.remove("hidden");
    document.getElementById("property_id").value = data.id || "";

    PROPERTY_FIELDS.forEach((field) => {
        const input = document.getElementById(field);

        if (!input) {
            return;
        }

        const value = data[datasetKey(field)];

        input.value = value || PROPERTY_FALLBACKS[field] || "";
    });

    // Configurar auto_send_report
    const autoSendCheckbox = document.getElementById("auto_send_report");
    autoSendCheckbox.checked = data.autoSendReport === 'true' || data.autoSendReport === true;

    // Mostrar/ocultar configuración de horario
    const scheduleContainer = document.getElementById("reportScheduleContainer");
    if (autoSendCheckbox.checked) {
        scheduleContainer.classList.remove("hidden");

        // Llenar los campos de horario
        if (data.reportFrequency) {
            document.getElementById("report_frequency").value = data.reportFrequency;
        }
        if (data.reportDay) {
            document.getElementById("report_day").value = data.reportDay;
        }
        if (data.reportHour) {
            document.getElementById("report_hour").value = data.reportHour;
        }
    } else {
        scheduleContainer.classList.add("hidden");
    }

    document.getElementById("propertyForm").action = "/properties/update";
}

function editPropertyFromButton(button) {
    if (!button || !button.dataset) {
        return;
    }

    editProperty(button.dataset);
}

function closeModal() {
    const modal = document.getElementById("propertyModal");
    modal.classList.remove("flex");
    modal.classList.add("hidden");
    document.getElementById("propertyForm").reset();
}

</script>
