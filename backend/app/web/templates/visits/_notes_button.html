{#
  Botón "Observaciones internas" de una fila de visita (PLAN_CEDER_COMPRADORES.md §3).
  Necesita `visit` en el contexto y, una vez por página, `visits/_notes_drawer.html`,
  que abre el panel con el texto completo leído de los data-* (escapados por Jinja).
#}
{% if visit.notes %}
<button type="button"
    class="inline-flex items-center justify-center w-9 h-9 rounded-lg text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900/20 shrink-0"
    data-visit-notes="{{ visit.notes }}"
    data-visit-visitor="{{ visit.visitor_name or '' }}"
    data-visit-date="{{ visit.created_at | madrid_dt('%d/%m/%Y %H:%M') if visit.created_at else '' }}"
    title="Observaciones internas"
    aria-label="Ver observaciones internas de la visita de {{ visit.visitor_name or 'este visitante' }}">
    <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>
</button>
{% endif %}
